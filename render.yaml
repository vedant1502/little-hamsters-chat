services:
  - type: web
    name: little-hamsters-chat
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CA_CERT_PATH
        value: /etc/secrets/supabase-ca.crt
      - key: DATABASE_URL
        sync: false

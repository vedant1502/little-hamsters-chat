<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a7d985">
  <title>Reset password · Little Hamsters</title>
  <link rel="stylesheet" href="styles/login.css">
  <script src="scripts/forgot-password.js?v=2" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="hero-panel" aria-labelledby="appTitle">
      <img src="hamsters/Picsart_25-12-10_11-11-08-730.png" class="hamster-hero" alt="Little Hamsters mascot">
      <div>
        <p class="eyebrow">We’ll get you back in</p>
        <h1 class="title" id="appTitle">Forgot password?</h1>
        <p class="subtitle">Use the security question you saved when you created your account to choose a new password.</p>
      </div>
    </section>

    <section class="login-box auth-box" aria-labelledby="recoveryTitle">
      <form class="auth-form" id="recoveryForm">
        <p class="eyebrow">Account recovery</p>
        <h2 id="recoveryTitle">Reset your password</h2>
        <label for="recoveryIdentifier">Username or mobile number</label>
        <input type="text" id="recoveryIdentifier" autocomplete="username" placeholder="Username or 10-digit mobile" required>
        <label for="recoveryQuestion">Your security question</label>
        <select id="recoveryQuestion" required>
          <option value="" selected disabled>Choose the question you saved</option>
          <option value="first-pet">What was the name of your first pet?</option>
          <option value="birth-city">In what city were you born?</option>
          <option value="first-school">What was the name of your first school?</option>
          <option value="childhood-nickname">What was your childhood nickname?</option>
          <option value="childhood-friend">What was the name of a childhood friend?</option>
        </select>
        <label for="recoveryAnswer">Your answer</label>
        <input type="text" id="recoveryAnswer" autocomplete="off" maxlength="100" required>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="6" maxlength="128" placeholder="At least 6 characters" required>
        <button type="submit" id="recoveryButton">Reset password</button>
        <p class="status-message" id="recoveryStatus" role="status" aria-live="polite"></p>
        <nav class="auth-links" aria-label="Account navigation">
          <a href="index.html">Back to log in</a>
          <a href="register.html">Create an account</a>
        </nav>
      </form>
    </section>
  </main>
</body>
</html>
